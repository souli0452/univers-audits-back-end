spring.application.name=univers-audits
server.port=8081

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

keycloak.admin.realm=asce-lc
keycloak.admin.client-id=asce-lc-backend
keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET}

asce.admin.keycloak-sub=${ASCE_ADMIN_SUB}

spring.mail.host=mailer.gov.bf
spring.mail.port=587
spring.mail.username=denoncer.dsida@asce-lc.bf
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=${spring.mail.username}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.transport.protocol=smtp

africastalking.username=sandbox
africastalking.apiKey=${AT_API_KEY}
africastalking.senderId=ASCELC
africastalking.apiUrl=https://api.sandbox.africastalking.com/version1/messaging
sms.enabled=false

# ?? Upload & Storage ??????????????????????????????????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
storage.max-file-size=26214400
storage.signed-url-expiry=15

# ?? Cache Redis ???????????????????????????????????????????????
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# ?? Thread pools ??????????????????????????????????????????????
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.scheduling.pool.size=5

# ?? Actuator ??????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# ?? Swagger ???????????????????????????????????????????????????
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html