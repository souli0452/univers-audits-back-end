keycloak.admin.realm=asce-lc
keycloak.admin.client-id=asce-lc-backend
keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET:wK2sXd4ovtG3KlYhN8IbkPJfE1nhFfT3}