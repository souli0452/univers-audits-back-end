spring.datasource.url=jdbc:postgresql://localhost:5432/bd_univers_audit

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/asce-lc

keycloak.admin.server-url=http://localhost:8080
spring.data.redis.host=localhost
spring.data.redis.port=6379

storage.upload-dir=C:/asce-lc/uploads
app.api-base-url=http://localhost:8081

spring.jpa.show-sql=true
logging.level.root=INFO
logging.level.gov.bf.ascelc=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%thread]){magenta} %clr(%logger{36}){cyan} - %msg%n
logging.file.name=C:/asce-lc/logs/univers-audits.log
logging.file.max-size=10MB
logging.file.max-history=30