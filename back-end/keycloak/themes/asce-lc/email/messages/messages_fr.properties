passwordResetSubject=Réinitialisation de votre mot de passe - ASCE-LC
emailVerificationSubject=Vérification de votre adresse e-mail - ASCE-LC

# Courriel envoyé à la création d'un compte (lien pour choisir son mot de passe).
# {0} = lien, {3} = actions demandées, {4} = durée de validité du lien.
executeActionsSubject=Bienvenue sur ASCE-LC : activez votre compte
executeActionsBody=Bonjour,\n\nUn compte ASCE-LC a été créé pour vous. Pour l''activer, choisissez votre mot de passe depuis ce lien :\n\n{0}\n\nCe lien expire dans {4}. À votre première connexion, il vous sera demandé de configurer un code de vérification dans une application d''authentification (Google Authenticator, Microsoft Authenticator ou FreeOTP) sur votre téléphone.\n\nSi vous n''attendiez pas ce message, ignorez-le : aucun changement ne sera effectué sur votre compte.\n\nCordialement,\nL''équipe ASCE-LC
executeActionsBodyHtml=<p>Bonjour,</p><p>Un compte <strong>ASCE-LC</strong> a été créé pour vous. Pour l''activer, choisissez votre mot de passe :</p><p><a href="{0}">Activer mon compte</a></p><p>Ce lien expire dans {4}. À votre première connexion, il vous sera demandé de configurer un code de vérification dans une application d''authentification (Google Authenticator, Microsoft Authenticator ou FreeOTP) sur votre téléphone.</p><p>Si vous n''attendiez pas ce message, ignorez-le : aucun changement ne sera effectué sur votre compte.</p><p>Cordialement,<br>L''équipe ASCE-LC</p>
